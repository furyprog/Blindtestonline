<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catalogue BuzzHit : tous les titres du blind test</title>
<meta name="description" content="Recherchez parmi tous les titres et artistes de BuzzHit, le blind test où vos téléphones deviennent des buzzers.">
<link rel="canonical" href="https://buzzhit.fr/catalogue.html">
<meta property="og:type" content="website"><meta property="og:site_name" content="BuzzHit"><meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://buzzhit.fr/catalogue.html"><meta property="og:title" content="Catalogue BuzzHit : cherchez votre titre ou votre artiste">
<meta property="og:description" content="Plus de 1 500 titres de 1960 à aujourd'hui. Recherchez par artiste, titre, genre ou époque.">
<meta property="og:image" content="https://buzzhit.fr/partage.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="theme-color" content="#12101a"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#12101a;--c:#221c38;--a:#ffb545;--r:#ff4d6d;--t:#f3efe8;--m:#9086ac}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,"Segoe UI",sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.top{text-align:center}.top img{width:150px;height:150px;object-fit:contain;-webkit-mask-image:radial-gradient(circle closest-side,#000 82%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 82%,transparent 100%)}
h1{font-size:24px;margin:0 0 4px}.m{color:var(--m);font-size:14px}
.card{background:var(--c);border:1px solid #2c2648;border-radius:16px;padding:16px;margin-bottom:12px}
a.btn,button{display:inline-block;font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:#2c2648;color:var(--t);cursor:pointer;text-decoration:none;text-align:center}
.p,a.btn.p{background:var(--a);color:#1a1526}.g{background:0;border:1px solid #352d54;color:var(--m)}
input,select{font:inherit;width:100%;background:#171329;color:var(--t);border:1px solid #352d54;border-radius:10px;padding:12px;margin:4px 0}
#q{font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 150px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips button{flex:none;padding:8px 12px;font-size:13px;border-radius:999px;background:#2c2648}
.chips button.on{background:var(--a);color:#1a1526}
.it{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid #2c2648}.it:last-child{border:0}
.it b{display:block}.it small{color:var(--m)}.yr{flex:none;font-weight:800;color:var(--a);align-self:center}
mark{background:#ffb54555;color:inherit;border-radius:3px}
#cnt{margin:6px 2px 10px}.more{width:100%;margin-top:10px}
.cta{display:flex;gap:8px;justify-content:center;margin:10px 0 14px;flex-wrap:wrap}
footer{text-align:center;margin-top:20px}
</style></head><body><div class="w">
<div class="top"><img src="BuzzHit.png" alt="BuzzHit"><h1>Catalogue BuzzHit</h1><div class="m" id="sub">Chargement…</div>
<div class="cta"><a class="btn p" href="https://buzzhit.fr/">🎮 Jouer maintenant</a></div></div>
<div class="card">
<input id="q" type="search" placeholder="🔎 Un artiste ou un titre…" autocomplete="off">
<div class="row"><select id="g"><option value="">Tous les genres</option></select><select id="l"><option value="">Toutes les langues</option></select><select id="s"><option value="a">Tri : artiste (A → Z)</option><option value="t">Tri : titre (A → Z)</option><option value="y">Tri : année (récents d'abord)</option><option value="o">Tri : année (anciens d'abord)</option></select></div>
<div class="chips" id="dec"></div></div>
<div id="cnt" class="m"></div>
<div class="card" id="res" style="padding:6px 14px"></div>
<button class="more g" id="more" hidden>Voir plus de titres</button>
<footer class="m">Liste des titres disponibles dans BuzzHit. Les extraits sont joués depuis YouTube pendant la partie.<br><a href="https://buzzhit.fr/" style="color:var(--a)">buzzhit.fr</a></footer>
</div>
<script>
const $=id=>document.getElementById(id);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/['’`]/g,' ').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const langN=l=>l==='Français'||l==='Anglais'?l:'Autre';
const DEC=[['Toutes les époques','',''],['60-70',1960,1979],['Années 80',1980,1989],['Années 90',1990,1999],['Années 2000',2000,2009],['2010+',2010,9999]];
let DB=[],decI=0,shown=60,list=[];
function hl(txt,words){let h=esc(txt);if(!words.length)return h;const nt=norm(txt);
 // surlignage simple : mots entiers insensibles aux accents, uniquement si la longueur est conservée
 try{if(nt.length&&txt.normalize('NFD').replace(/[̀-ͯ]/g,'').length===txt.length){const re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  const base=txt.normalize('NFD').replace(/[̀-ͯ]/g,'');let out='',last=0,m;re.lastIndex=0;while((m=re.exec(base))){if(!m[0])break;out+=esc(txt.slice(last,m.index))+'<mark>'+esc(txt.slice(m.index,m.index+m[0].length))+'</mark>';last=m.index+m[0].length}out+=esc(txt.slice(last));return out}}catch(_){}
 return h}
function run(){const q=norm($('q').value),w=q?q.split(' ').filter(Boolean):[],g=$('g').value,l=$('l').value,d=DEC[decI];
 list=DB.filter(t=>(!g||t.genre===g)&&(!l||langN(t.langue)===l)&&(!d[1]||(t.year>=d[1]&&t.year<=d[2]))&&w.every(x=>t._n.includes(x)));
 const s=$('s').value,cmp={a:(x,y)=>x._a.localeCompare(y._a,'fr')||x._t.localeCompare(y._t,'fr'),t:(x,y)=>x._t.localeCompare(y._t,'fr'),y:(x,y)=>y.year-x.year||x._a.localeCompare(y._a,'fr'),o:(x,y)=>x.year-y.year||x._a.localeCompare(y._a,'fr')}[s];list.sort(cmp);
 render(w);try{const u=new URLSearchParams();if($('q').value)u.set('q',$('q').value);history.replaceState(null,'',u.toString()?'?'+u:location.pathname)}catch(_){}}
function render(w){w=w||norm($('q').value).split(' ').filter(Boolean);
 $('cnt').textContent=list.length?(list.length+' titre'+(list.length>1?'s':'')+' trouvé'+(list.length>1?'s':'')):'';
 $('res').innerHTML=list.length?list.slice(0,shown).map(t=>`<div class="it"><div><b>${hl(t.title,w)}</b><small>${hl(t.artist,w)} · ${esc(t.genre)} · ${esc(t.langue)}</small></div><span class="yr">${t.year}</span></div>`).join(''):'<p class="m" style="text-align:center;padding:14px">Aucun titre trouvé. Essayez une autre orthographe ou retirez un filtre.</p>';
 $('more').hidden=list.length<=shown;$('more').textContent='Voir plus de titres ('+(list.length-shown)+' restants)'}
function chips(){$('dec').innerHTML=DEC.map((x,i)=>`<button class="${i===decI?'on':''}" data-i="${i}">${x[0]}</button>`).join('')}
$('dec').onclick=e=>{const b=e.target.closest('button');if(!b)return;decI=+b.dataset.i;shown=60;chips();run()};
['q','g','l','s'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',()=>{shown=60;run()}));
$('more').onclick=()=>{shown+=60;render()};
fetch('titres.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
 DB=(Array.isArray(j)?j:j.titres||[]).map(t=>({...t,_a:norm(t.artist),_t:norm(t.title),_n:norm(t.artist+' '+t.title)}));
 const G=[...new Set(DB.map(t=>t.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));
 $('g').innerHTML='<option value="">Tous les genres</option>'+G.map(x=>`<option>${esc(x)}</option>`).join('');
 $('l').innerHTML='<option value="">Toutes les langues</option>'+['Français','Anglais','Autre'].map(x=>`<option>${x}</option>`).join('');
 $('sub').textContent=DB.length.toLocaleString('fr-FR')+' titres de '+Math.min(...DB.map(t=>t.year))+' à '+Math.max(...DB.map(t=>t.year));
 const p=new URLSearchParams(location.search).get('q');if(p)$('q').value=p;chips();run()}).catch(()=>{$('sub').textContent='';$('res').innerHTML='<p class="m" style="text-align:center;padding:14px">Impossible de charger la liste des titres. Vérifiez votre connexion et réessayez.</p>'});
</script></body></html>
